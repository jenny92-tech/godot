name: 🛠 Build linuxbsd SDL2 arm64 POC

# POC build of godot 4.5 with the SDL2 DisplayServer + self-KMS/GBM/EGL.
# SDL2 is now only used for events/joystick (VIDEODRIVER=dummy at runtime),
# so the system libSDL2 2.0.10+ works fine — no more SDL2-from-source step.
# ubuntu:20.04 container keeps glibc ≤ 2.31 for PortMaster handheld compat
# (TrimUI = 2.33, MiniLoong similar).

on:
  workflow_dispatch:

jobs:
  build:
    name: linuxbsd arm64 SDL2 template_release (glibc≤2.31)
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:20.04
    steps:
      - name: System prereqs
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            ca-certificates curl git binutils \
            python3 python3-pip \
            build-essential pkg-config \
            libsdl2-dev \
            libgl1-mesa-dev libglu1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libgbm-dev libdrm-dev \
            libasound2-dev libpulse-dev libudev-dev \
            libfontconfig1-dev libdbus-1-dev libspeechd-dev \
            libxkbcommon-dev
          ldd --version | head -1
          gcc --version | head -1

      - uses: actions/checkout@v4

      - name: Python build deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install scons==4.7.0
          scons --version | head -2

      - name: Build godot (linuxbsd arm64, SDL2 dynamic, self-KMS, no mono)
        run: |
          # sdl=no:关 godot 自家 SDL3 输入(避免 SDL2/SDL3 同进程冲突)
          # sdl2=yes:开我们的 DisplayServerSDL2(自己 KMS/GBM/EGL,不靠 SDL2 video)
          # x11=no wayland=no:不要 godot 自家 X11/Wayland 平台(libmali 不支持 X11)
          scons \
            platform=linuxbsd \
            arch=arm64 \
            sdl2=yes \
            sdl=no \
            x11=no \
            wayland=no \
            target=template_release \
            module_mono_enabled=no \
            production=yes \
            debug_symbols=no \
            -j$(nproc) 2>&1 | tee /tmp/build.log

      - name: Verify binary
        run: |
          BIN=$(ls bin/godot.linuxbsd.template_release.arm64* 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            echo "BUILD ARTIFACT NOT FOUND"
            tail -50 /tmp/build.log
            exit 1
          fi
          echo "Built: $BIN ($(ls -la $BIN | awk '{print $5}') bytes)"
          file "$BIN"
          echo "--- GLIBC requirement ---"
          objdump -T "$BIN" 2>/dev/null | awk '/GLIBC_/{print $5}' | sort -u
          echo "--- 动态链应有 libSDL2 + libdrm + libgbm + libEGL/GLES NEEDED ---"
          ldd "$BIN" 2>&1 | grep -E "SDL|drm|gbm|EGL|GLES|udev|mali" || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-linuxbsd-sdl2-arm64-POC
          path: |
            bin/godot.linuxbsd.template_release.arm64*
            /tmp/build.log
          if-no-files-found: warn
