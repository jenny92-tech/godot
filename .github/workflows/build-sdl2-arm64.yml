name: 🛠 Build linuxbsd SDL2 arm64 POC

# POC build of godot 4.5 with the SDL2 DisplayServer module.
# Phase 1: NO mono (validate SDL2 platform code compiles + links). Phase 2 will
# enable module_mono_enabled. ubuntu:20.04 container keeps glibc ≤ 2.31 for
# PortMaster handheld compatibility (TrimUI = 2.33, MiniLoong similar).

on:
  workflow_dispatch:
  push:
    branches:
      - linuxbsd-sdl2
    paths:
      - 'platform/linuxbsd/**'
      - '.github/workflows/build-sdl2-arm64.yml'

jobs:
  build:
    name: linuxbsd arm64 SDL2 template_release (glibc≤2.31)
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:20.04
    steps:
      - name: System prereqs (godot deps + SDL2 build deps)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          # 装 godot 4.5 linuxbsd 编译需要的库,以及 SDL2 自身从源码编需要的依赖
          # (libdrm/libgbm/wayland-protocols/libudev/...:SDL2 KMSDRM + wayland backend 需要)
          apt-get install -y \
            ca-certificates curl git binutils \
            python3 python3-pip cmake autoconf automake libtool \
            build-essential pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libgbm-dev libdrm-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev \
            libfontconfig1-dev libdbus-1-dev libspeechd-dev \
            libinput-dev
          ldd --version | head -1
          gcc --version | head -1

      - name: Build SDL2 2.30 LTS from source (static)
        run: |
          # 2.30.x = SDL2 最后 LTS,有完整 KMSDRM hint(SDL_KMSDRM_REQUIRE_DRM_MASTER 等),
          # 修了 ubuntu 20.04 自带 2.0.10 在 Mali libmali 上的 KMSDRM NULL crash。
          # configure 时:
          # - --disable-shared --enable-static:只输出 .a
          # - --enable-video-kmsdrm --enable-video-wayland:两个 backend 都进 binary
          # - --enable-video-dummy --enable-video-offscreen:diagnostic backend
          # - --disable-{video-x11,opengl,esd,arts,nas}:不需要的关掉,减体积
          mkdir -p /tmp/SDLsrc && cd /tmp/SDLsrc
          git clone --depth 1 --branch release-2.30.10 https://github.com/libsdl-org/SDL.git .
          mkdir -p build && cd build
          ../configure --prefix=/opt/sdl2-static \
            --disable-shared --enable-static \
            --enable-video-kmsdrm --enable-video-wayland \
            --enable-video-dummy --enable-video-offscreen \
            --disable-video-x11 \
            --enable-video-opengl --enable-video-opengles --enable-video-opengles2 \
            --enable-libudev --enable-dbus --enable-ibus \
            --enable-alsa --enable-pulseaudio \
            --disable-esd --disable-arts --disable-nas \
            --disable-jack --disable-sndio \
            CFLAGS="-O2 -fPIC -fvisibility=hidden"
          make -j$(nproc) 2>&1 | tail -20
          make install
          ls -la /opt/sdl2-static/lib/libSDL2.a
          echo "--- pkg-config sanity ---"
          PKG_CONFIG_PATH=/opt/sdl2-static/lib/pkgconfig pkg-config --static sdl2 --libs

      - uses: actions/checkout@v4

      - name: Python build deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install scons==4.7.0
          scons --version | head -2

      - name: Build godot (linuxbsd arm64, SDL2 STATIC, no mono)
        run: |
          scons \
            platform=linuxbsd \
            arch=arm64 \
            sdl2=yes \
            sdl2_static=yes \
            x11=no \
            wayland=no \
            target=template_release \
            module_mono_enabled=no \
            production=yes \
            debug_symbols=no \
            -j$(nproc) 2>&1 | tee /tmp/build.log

      - name: Verify binary
        run: |
          BIN=$(ls bin/godot.linuxbsd.template_release.arm64* 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            echo "BUILD ARTIFACT NOT FOUND"
            tail -50 /tmp/build.log
            exit 1
          fi
          echo "Built: $BIN ($(ls -la $BIN | awk '{print $5}') bytes)"
          file "$BIN"
          echo "--- GLIBC requirement ---"
          objdump -T "$BIN" 2>/dev/null | awk '/GLIBC_/{print $5}' | sort -u
          echo "--- SDL2 symbols (静态链应该 SDL_* 内嵌为本地符号,not undefined)---"
          objdump -T "$BIN" 2>/dev/null | grep "SDL_" | head -5 || echo "(no undef SDL_ refs = static link confirmed)"
          echo "--- ldd 不应再有 libSDL2(静态链已嵌入)---"
          ldd "$BIN" 2>&1 | grep -i sdl && echo "WARNING: dynamic libSDL2 still linked" || echo "OK: no libSDL2 dynamic dep"
          echo "--- 应仍依赖的:libdrm libgbm libwayland libudev libmali(SDL2 内部 dlopen)---"
          ldd "$BIN" 2>&1 | grep -E "drm|gbm|wayland|udev|EGL|GLES" || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-linuxbsd-sdl2-arm64-POC
          path: |
            bin/godot.linuxbsd.template_release.arm64*
            /tmp/build.log
          if-no-files-found: warn
